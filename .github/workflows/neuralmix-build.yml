name: NeuralMix Development Build

on:
  push:
    branches:
      - neuralmix-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuralmix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NeuralMix Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android dependencies
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Restore persistent debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.NEURALMIX_DEBUG_KEYSTORE }}
        run: |
          test -n "$DEBUG_KEYSTORE"
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "NEURALMIX_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"


      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Verify NeuralMix signing certificate
        run: |
          EXPECTED="4a17eae1e9bb632d25acc7e5145ca7ef1f50b862ef784ceb0d22370e7057cccd"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk '/certificate SHA-256 digest:/ {print $NF}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: NeuralMix signing certificate mismatch"
            exit 1
          fi
          echo "Persistent signing verified successfully."

      - name: Prepare APK artifact
        run: |
          mkdir -p neuralmix-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            neuralmix-artifacts/LastWave-NeuralMix-debug.apk
          cd neuralmix-artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuralMix-Development-APK
          path: neuralmix-artifacts/
          if-no-files-found: error

      - name: Run AutoMix regression tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.lastwave.app.playback.automix.*' \
            --max-workers=2 \
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralMix-Test-Reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/automix-renders/
          if-no-files-found: ignore
